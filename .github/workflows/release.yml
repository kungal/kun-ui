name: Release

on:
  push:
    branches: [main]

# Only one release run at a time; a newer push supersedes an in-flight one.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # commit the version bump back to main + push git tags + create GitHub Releases
  id-token: write # OIDC token for npm trusted publishing (no NPM_TOKEN needed)
  actions: write # dispatch the docs-image workflow after a release

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # npm >= 11.5.1 is required for OIDC trusted publishing + auto-provenance.
      - run: npm install -g npm@latest

      # No "Version Packages" PR: when a push to main carries changesets, apply
      # them, commit the bump straight back to main, then publish to npm. When a
      # push carries no changesets, `changeset version` is a no-op and we bail
      # out early — so non-release commits cost one quick, cheap run.
      #
      # Workspace deps are `version: link:` in the lockfile (no pinned number),
      # so a version bump never changes pnpm-lock.yaml — no reinstall needed.
      - name: Version and publish
        id: release
        run: |
          set -euo pipefail

          pnpm ci:version  # changeset version: bump package.json + CHANGELOG, drop .changeset/*.md

          VERSION=$(node -p "require('./packages/vue/package.json').version")

          if git diff --quiet; then
            # No changesets — but don't bail before checking npm: a publish that
            # dies mid-flight (2.35.1: the registry 422'd ui-nuxt's provenance
            # after three packages were already up) leaves main bumped while
            # npm, the tags and the Release are incomplete. `changeset publish`
            # skips versions npm already has, so falling through to the publish
            # tail is a safe resume. Note re-running the *failed* run does not
            # recover: its SHA still carries the changesets, so it re-versions
            # and its push back to main is non-fast-forward. Recover by pushing
            # any commit to main (an empty one is fine) and landing here.
            RESUME=false
            for PKG in ui-tokens ui-core ui-vue ui-nuxt; do
              npm view "@kungal/${PKG}@${VERSION}" version >/dev/null 2>&1 || RESUME=true
            done
            if [ "${RESUME}" = false ]; then
              echo "No changesets present — nothing to release."
              echo "released=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Resuming the interrupted ${VERSION} publish."
          else
            # Refresh the docs /changelog page data from the just-updated CHANGELOG
            # so it ships inside this same release commit (no hand-written docs).
            pnpm --filter @kungal/docs gen:changelog || true

            # The pub.dev package's version is locked to the npm lockstep version:
            # pub refuses a publish whose pubspec version doesn't match the tag
            # this job pushes, and gen-tokens.mjs refuses to run when the two
            # diverge. Sync before the bump is committed so both travel together.
            node scripts/sync-pub-version.mjs

            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: release packages [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"   # commit the bump back to main
          fi

          pnpm ci:publish      # build packages + changeset publish (OIDC + provenance)

          # changeset publish only tags what it publishes in this run, so a
          # resume never tags the packages that made it to npm before the
          # failure — recreate any missing tag (no-op on a clean run).
          for PKG in ui-tokens ui-core ui-vue ui-nuxt; do
            TAG="@kungal/${PKG}@${VERSION}"
            git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null || git tag "${TAG}"
          done
          git push origin --tags

          # pub.dev's OIDC publishing is tag-scoped: the token's ref claim must
          # match the tag pattern configured on pub.dev. changeset only tags
          # the npm packages, hence tags of our own — guarded because a re-run
          # must not fail on a tag that already exists. The dispatch is what
          # actually starts each publish workflow: these tag pushes use
          # GITHUB_TOKEN, and GitHub never starts workflows for events made
          # with that token (the 2.33.0 tag push started nothing).
          # workflow_dispatch is exempt from that suppression.
          PUB_VERSION=$(node -p "require('./packages/ui-tokens/package.json').version")
          for PUB in "kun_ui_tokens:publish-pub.yml" "kun_ui_icons:publish-pub-icons.yml"; do
            TAG="${PUB%%:*}-v${PUB_VERSION}"
            WORKFLOW="${PUB##*:}"
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "${TAG} already exists; skipping tag creation"
            else
              git tag "${TAG}"
              git push origin "${TAG}"
            fi
            gh workflow run "${WORKFLOW}" --ref "${TAG}" \
              || echo "Could not dispatch ${WORKFLOW} — re-push ${TAG} or dispatch it manually (docs/RELEASING.md)."
          done

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./packages/vue/package.json').version")" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: authentication happens via OIDC (id-token: write).
          # Provenance is emitted automatically under trusted publishing.

      # Publish a GitHub Release per version (the 4 packages move in lockstep, so
      # one Release on the ui-vue tag covers them). Notes = the newest CHANGELOG
      # block — same content as the changesets, with zero extra hand-writing.
      - name: Create GitHub Release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          NOTES=$(awk 'f && /^## /{exit} /^## /{f=1; next} f' packages/vue/CHANGELOG.md)
          gh release create "@kungal/ui-vue@${VERSION}" \
            --title "v${VERSION}" \
            --notes "${NOTES:-Release v${VERSION}}" \
            || echo "Release for v${VERSION} may already exist; skipping."

      # The bump commit is [skip ci], so docs-image won't auto-trigger — kick it
      # so the live /changelog page picks up the freshly-committed entry.
      - name: Trigger docs site rebuild
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run docs-image.yml --ref "${GITHUB_REF_NAME}" \
            || echo "Could not dispatch docs-image; it will rebuild on the next docs change."
