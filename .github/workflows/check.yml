name: check

# The pull-request gate. Until this existed nothing at all ran on a PR: Release
# only fires on push to main (and publishes to npm as its first act), and
# docs-image only builds after the merge. A PR that didn't typecheck, didn't
# build, or left the generated docs stale merged green and broke main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first, and everything else after it. Every workspace dependency is
      # `workspace:*`, which resolves to the dependency's `dist` — including for
      # type resolution — so on a bare checkout nothing that reads types across
      # a package boundary works until dist exists. `pnpm typecheck` ahead of
      # this line fails with `Cannot find module '@kungal/ui-core'`, which is not
      # something you notice locally, where dist is always lying around from the
      # last build.
      #
      # This is also the same build `ci:publish` runs before `changeset publish`,
      # so a broken build is a red PR rather than a half-finished release that
      # has already pushed a version bump to main.
      - run: pnpm build

      # Not redundant with the vue-tsc pass inside the build: that one runs over
      # tsconfig.build.json (src only, emitting .d.ts), while this covers
      # tsconfig.json — src plus vite.config.ts — and gives ui-core a real
      # `tsc --noEmit`, which its tsup `dts: true` step is not.
      - run: pnpm typecheck

      # ./apps/* — the Vite playground had a `typecheck` script that nothing ever
      # invoked, which made it the one place the packages get exercised the way a
      # real consumer sees them: through dist and its generated .d.ts, not src.
      - run: pnpm typecheck:apps

      # Build the docs site. `docs-image` builds it too, but only on push to
      # main and via Docker — so until now a PR that broke the site merged green
      # and the failure surfaced as a red image build on main, after the fact.
      # This is also the only thing that exercises @kungal/ui-nuxt: that package
      # ships `nuxt.config.ts` + `app/` as source with no build and no
      # typecheck, and the docs site `extends` it.
      - run: pnpm build:docs

  generated:
    name: Generated files are up to date
    # Every generated-and-committed artifact must match what the generators
    # produce from the current sources. These artifacts (palette.generated.css,
    # icons-data.ts, component-meta.json, the per-route .md files, llms.txt,
    # changelog.json, upgrade.json) are committed because the build consumes
    # them directly — the docs image never runs vue-component-meta, and the
    # published packages ship the palette and the icon data as plain source. But
    # nothing ran the generators automatically, so they were only as fresh as
    # the last person who remembered. They drifted badly: 15 pages had no .md at
    # all, llms.txt was 13 components behind, and the props tables still
    # described props by their pre-refactor types.
    #
    # `pnpm gen` runs the two package generators first, because they write into
    # packages/*/src — which is what the docs generators then read.
    # gen:tokens doubles as a guard of its own: it asserts every solid/on-color
    # pair clears WCAG AA in both modes and exits non-zero if one doesn't, so a
    # retheme can no longer land an illegible color.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The generators read `packages/*/src`, never dist — with one exception.
      # gen:meta types the Vue components through a real TypeScript program, and
      # they import their shared types from @kungal/ui-core, whose `exports`
      # resolve to dist/index.d.ts. Without it TypeScript widens all of them to
      # `any` instead of failing, so this job would regenerate a gutted
      # component-meta.json and report the *committed* file as out of date.
      # gen-meta.mjs now refuses to run in that state; this is what keeps it
      # from having to. One tsup build, not the whole workspace — so this job
      # still starts in seconds and runs in parallel with the build one.
      - run: pnpm --filter @kungal/ui-core build

      - run: pnpm gen

      - name: Fail if anything changed
        run: |
          set -euo pipefail
          # --porcelain, not `git diff --exit-code`: a generator that produces a
          # brand-new file (a component page that never had one) leaves it
          # untracked, which a diff wouldn't see at all — exactly the case that
          # let 15 pages go missing.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are out of date. Run 'pnpm gen' and commit the result."
            git status --porcelain
            git --no-pager diff
            exit 1
          fi
          echo "Generated files are in sync."
