name: docs-image

# Build the docs site image and push it to GHCR, mirroring the infra
# (GHCR + Actions → Dokploy pulls prebuilt) pipeline. Production never builds.
on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/**'
      - 'docker/docs.Dockerfile'
      - '.dockerignore'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs-image.yml'

permissions:
  contents: read
  packages: write # push to GHCR

concurrency:
  group: docs-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/docs.Dockerfile
          push: true
          tags: |
            ghcr.io/kungal/kun-ui-docs:latest
            ghcr.io/kungal/kun-ui-docs:${{ github.sha }}
          cache-from: type=gha,scope=kun-ui-docs
          cache-to: type=gha,mode=max,scope=kun-ui-docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy redeploy
        env:
          # Set this to the Dokploy app's deploy webhook URL (and disable that
          # app's Auto Deploy) so it pulls the freshly-built :latest.
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_DOCS }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DOKPLOY_WEBHOOK_DOCS not set; image pushed to GHCR, skipping redeploy."
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK"
